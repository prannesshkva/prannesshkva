<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 100" width="100%" height="100">
  <defs>
    <style>
      .hero-name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 4px;
        text-anchor: middle;
        fill: #ffffff;
      }

      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 2.8px;
        text-anchor: middle;
        fill: #9ca3af;
      }

      @media (prefers-color-scheme: light) {
        .hero-name {
          fill: #0f172a !important;
        }
        .hero-title {
          fill: #475569 !important;
        }
      }
    </style>
  </defs>

  <!-- Transparent Canvas: Text Alone (No Background / No Box / No Border) -->
  <g>
    <!-- Name -->
    <text x="440" y="48" class="hero-name">
      Prannessh KVA
      <animate attributeName="opacity" values="0.92;1;0.92" dur="5s" repeatCount="indefinite"/>
    </text>

    <!-- Subtitle -->
    <text x="440" y="82" class="hero-title">
      AI Systems Architect &amp; Researcher-Inspired Engineer
    </text>
  </g>
</svg>
