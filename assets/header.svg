<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="100%" height="196">
  <defs>
    <!-- Apple Dark Canvas Gradient -->
    <linearGradient id="appleCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="50%" stop-color="#12151b"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>

    <!-- Subtle, Elegant Typography Sheen (Monochrome / Silver-White, No Neon) -->
    <linearGradient id="appleTextSheen" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-100%;100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;300%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Subtle Ambient Diffuse Light Behind Typography -->
    <radialGradient id="diffuseAmbient" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0c0e12" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Hairline Border Gradient -->
    <linearGradient id="hairlineBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4b5563" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background Container -->
  <rect x="1" y="1" width="878" height="194" rx="18" ry="18" fill="url(#appleCanvas)"/>
  <rect x="1" y="1" width="878" height="194" rx="18" ry="18" fill="url(#diffuseAmbient)"/>
  
  <!-- Apple Hairline Stroke -->
  <rect x="1" y="1" width="878" height="194" rx="18" ry="18" fill="none" stroke="url(#hairlineBorder)" stroke-width="1.2"/>

  <!-- Main Hero Title (SF Pro / Inter Style, Pure High-Contrast White) -->
  <g text-anchor="middle">
    <text x="440" y="82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="700" font-size="44" letter-spacing="4" fill="url(#appleTextSheen)">
      Prannessh KVA
    </text>

    <!-- Subtitle (Clear, Crisp, High-Readability Silver-Slate) -->
    <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="500" font-size="15" letter-spacing="2.8" fill="#9ca3af">
      AI Systems Architect &amp; Researcher-Inspired Engineer
    </text>
  </g>

  <!-- Minimal Apple-Style Capsule Pill -->
  <g transform="translate(160, 142)">
    <rect x="0" y="0" width="560" height="32" rx="16" ry="16" fill="#161920" stroke="#2d323e" stroke-width="1"/>
    
    <!-- Subtle status dot in muted neutral slate -->
    <circle cx="22" cy="16" r="3" fill="#cbd5e1">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', monospace" font-size="12" font-weight="500" fill="#d1d5db" letter-spacing="1">
      <tspan fill="#f3f4f6" font-weight="600">Core Architecture:</tspan> Differentiable Cortical AI (0-Token Autograd) · Lie-Group SSMs
    </text>
  </g>
</svg>
